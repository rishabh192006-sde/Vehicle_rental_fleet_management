<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
        }

        .signup-container {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .signup-box {
            width: 100%;
            max-width: 665px;

            background: white;

            padding: 40px;

            border: 1px solid #dbe3ec;
            border-radius: 18px;

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        .signup-box h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #0f172a;
        }

        .signup-box > p {
            color: #64748b;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            font-weight: bold;
            color: #1e293b;

            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;

            height: 47px;

            padding: 10px 14px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .terms {
            display: flex;

            align-items: center;

            gap: 8px;

            margin: 20px 0;

            color: #64748b;

            font-size: 14px;
        }

        .terms input {
            width: 15px;
            height: 15px;
        }

        .terms a {
            color: #2563eb;
        }

        .signup-button {
            width: 100%;

            height: 50px;

            border: none;
            border-radius: 8px;

            background: #2563eb;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .signup-button:hover {
            background: #1d4ed8;
        }

        .login-link {
            text-align: center;

            margin-top: 22px;

            color: #64748b;
        }

        .login-link a {
            color: #2563eb;
            font-weight: bold;
        }


        /* Mobile */

        @media (max-width: 600px) {

            .signup-container {
                padding: 20px;
            }

            .signup-box {
                padding: 25px;
            }

            .signup-box h1 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <div class="signup-container">

        <div class="signup-box">

            <h1>
                Create Account
            </h1>

            <p>
                Fill in the details to create your account.
            </p>


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    placeholder="Enter your full name"
                >

            </div>


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    placeholder="Enter your email"
                >

            </div>


            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="text"
                    placeholder="Enter your phone number"
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    placeholder="Create a password"
                >

            </div>


            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    placeholder="Confirm your password"
                >

            </div>


            <label class="terms">

                <input type="checkbox">

                <span>
                    I agree to the
                    <a href="#">
                        Terms & Conditions
                    </a>
                </span>

            </label>


            <button class="signup-button">
                Create Account
            </button>


            <div class="login-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </div>


</body>

</html>
