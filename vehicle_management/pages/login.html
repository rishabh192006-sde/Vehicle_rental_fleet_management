<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - VehicleRent</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }

        .login-container {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 665px;

            background: white;

            border: 1px solid #dbe3ec;
            border-radius: 18px;

            padding: 45px 40px;

            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.08);
        }

        .login-card h1 {
            font-size: 28px;
            color: #0f172a;
            margin-bottom: 15px;
        }

        .login-subtitle {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 35px;
        }

        .login-form-group {
            margin-bottom: 24px;
        }

        .login-form-group label {
            display: block;

            color: #1e293b;

            font-size: 16px;
            font-weight: 700;

            margin-bottom: 9px;
        }

        .login-form-group input {
            width: 100%;
            height: 49px;

            padding: 0 15px;

            border: 1px solid #cbd5e1;
            border-radius: 9px;

            outline: none;

            font-size: 15px;

            background: white;
        }

        .login-form-group input:focus {
            border-color: #2563eb;
        }

        .login-options {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin: 8px 0 28px;
        }

        .remember {
            display: flex;
            align-items: center;

            gap: 7px;

            color: #64748b;
            font-size: 14px;
        }

        .remember input {
            width: 15px;
            height: 15px;
        }

        .login-options a {
            color: #2563eb;

            font-size: 14px;
            font-weight: 700;

            text-decoration: none;
        }

        .login-button {
            width: 100%;
            height: 50px;

            border: none;
            border-radius: 9px;

            background: #2563eb;
            color: white;

            font-size: 17px;
            font-weight: 700;

            cursor: pointer;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .create-account {
            text-align: center;

            color: #64748b;

            font-size: 15px;

            margin-top: 27px;
        }

        .create-account a {
            color: #2563eb;
            font-weight: 700;

            text-decoration: none;
        }


        /* MOBILE */

        @media (max-width: 700px) {

            .login-container {
                padding: 25px 15px;
            }

            .login-card {
                padding: 30px 25px;
            }

            .login-card h1 {
                font-size: 26px;
            }

        }


        @media (max-width: 480px) {

            .login-card {
                padding: 25px 20px;
            }

            .login-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

        }

    </style>

</head>


<body>


    <main class="login-container">

        <div class="login-card">

            <h1>Login</h1>

            <p class="login-subtitle">
                Enter your details to access your account.
            </p>


            <div class="login-form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

            </div>


            <div class="login-form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >

            </div>


            <div class="login-options">

                <label class="remember">

                    <input type="checkbox">

                    <span>
                        Remember me
                    </span>

                </label>


                <a href="#">
                    Forgot Password?
                </a>

            </div>


            <button class="login-button">
                Login
            </button>


            <p class="create-account">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </p>

        </div>

    </main>


</body>

</html>
